name: Build and Release Executable

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Needed for creating a GitHub release
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller scapy
        
    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --name FaultTrace faulttrace.py
        
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: FaultTrace v1.0.${{ github.run_number }}
        files: dist/FaultTrace.exe
        body: "Automated build of FaultTrace verification suite."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
